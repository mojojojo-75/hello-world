<title>Eject Button</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: one centered cockpit panel with a single red button; after ejecting, a full-screen pasture canvas replaces it, with the headline pinned top and controls pinned bottom. Single dark look by choice. */
  :root {
    --panel: #1c1f22;
    --panel-edge: #2b2f33;
    --ink: #d9dcd6;
    --dim: #7d847c;
    --hazard: #f2c230;
    --red: #d7261e;
    --red-deep: #8e1410;
    --flash: #ff5a3c;
    --sky-ink: #ffffff;
    --shade: rgba(16, 20, 18, 0.72);
    --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 40%, #24282c 0%, var(--panel) 60%);
    background-color: var(--panel);
    color: var(--ink);
    font-family: var(--display);
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    box-sizing: border-box;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0;
    transition: opacity 1200ms ease;
    pointer-events: none;
  }
  #scene.on { opacity: 1; }

  .stage {
    position: relative;
    z-index: 1;
    display: grid;
    justify-items: center;
    gap: clamp(20px, 4vh, 36px);
    width: 100%;
  }
  .label, .status { transition: opacity 400ms ease; }
  .label {
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: clamp(14px, 2.4vw, 18px);
    color: var(--hazard);
    padding-left: 0.35em;
  }
  .bezel {
    --size: min(72vw, 58vh, 420px);
    width: var(--size);
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 50%;
    padding: calc(var(--size) * 0.07);
    box-sizing: border-box;
    background: repeating-linear-gradient(45deg, var(--hazard) 0 22px, #111 22px 44px);
    box-shadow: 0 0 0 6px var(--panel-edge), 0 24px 60px rgba(0,0,0,0.6);
    display: grid;
    transition: opacity 900ms ease 150ms, transform 900ms ease 150ms;
  }
  .well {
    border-radius: 50%;
    background: #0d0f10;
    box-shadow: inset 0 10px 30px rgba(0,0,0,0.9);
    display: grid;
    padding: 6%;
  }
  #eject {
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 38% 30%, #ff6a5c 0%, var(--red) 38%, var(--red-deep) 100%);
    box-shadow: 0 14px 0 #5c0b08, 0 18px 30px rgba(0,0,0,0.7), inset 0 -8px 20px rgba(0,0,0,0.35);
    color: #fff;
    font-family: var(--display);
    font-weight: 700;
    font-size: calc(var(--size) * 0.12);
    letter-spacing: 0.12em;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    transform: translateY(-10px);
    transition: transform 90ms ease, box-shadow 90ms ease, filter 200ms;
  }
  #eject:hover { filter: brightness(1.08); }
  #eject:active, #eject.pressed {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #5c0b08, 0 4px 10px rgba(0,0,0,0.7), inset 0 -4px 14px rgba(0,0,0,0.4);
  }
  #eject:focus-visible { outline: 4px solid var(--hazard); outline-offset: 8px; }
  #eject:disabled { cursor: default; }
  .status {
    font-family: var(--mono);
    font-size: clamp(12px, 2vw, 14px);
    color: var(--dim);
    letter-spacing: 0.08em;
    min-height: 1.4em;
    text-align: center;
  }

  body.ejected .bezel { opacity: 0; transform: scale(0.6); pointer-events: none; }
  body.ejected .label, body.ejected .status { opacity: 0; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding-top: calc(env(safe-area-inset-top, 0px) + clamp(28px, 7vh, 64px));
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(28px, 6vh, 56px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .controls { display: grid; justify-items: center; gap: 14px; }
  .headline {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(36px, 9vw, 84px);
    line-height: 1;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: center;
    text-wrap: balance;
    color: var(--sky-ink);
    text-shadow: 0 0 2px rgba(18,32,48,0.9), 0 2px 0 rgba(18,32,48,0.85), 0 4px 0 rgba(18,32,48,0.5), 0 0 24px rgba(18,32,48,0.45);
    margin: 0;
    animation: rise 600ms ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  #reset {
    pointer-events: auto;
    font: 500 14px var(--mono);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sky-ink);
    background: var(--shade);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 4px;
    padding: 12px 22px;
    cursor: pointer;
    animation: rise 500ms ease both;
  }
  #reset:hover { border-color: var(--hazard); color: var(--hazard); }
  #reset:focus-visible { outline: 2px solid var(--hazard); outline-offset: 3px; }
  .notice {
    font-family: var(--mono);
    font-size: clamp(13px, 2.2vw, 16px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sky-ink);
    background: var(--shade);
    border-radius: 3px;
    padding: 6px 10px;
    text-align: center;
    animation: rise 500ms ease 150ms both;
  }

  .modal-back {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(8, 10, 9, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    animation: fade 180ms ease both;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: min(420px, 100%);
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    animation: rise 220ms ease both;
  }
  .modal::before {
    content: "";
    display: block;
    height: 10px;
    background: repeating-linear-gradient(45deg, var(--hazard) 0 12px, #111 12px 24px);
  }
  .modal-body { display: grid; gap: 12px; padding: 22px 22px 8px; }
  .modal h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--sky-ink);
  }
  .modal p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink); }
  .modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 18px 22px 22px; }
  .modal-actions button {
    font: 500 13px var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 4px;
    padding: 11px 16px;
    cursor: pointer;
  }
  #cancel-rescind { background: transparent; color: var(--ink); border: 1px solid var(--dim); }
  #cancel-rescind:hover { border-color: var(--ink); }
  #confirm-rescind { background: var(--red); color: #fff; border: 1px solid var(--red-deep); }
  #confirm-rescind:hover { filter: brightness(1.1); }
  .modal-actions button:focus-visible { outline: 2px solid var(--hazard); outline-offset: 3px; }

  .flash {
    position: fixed;
    inset: 0;
    z-index: 3;
    background: var(--flash);
    opacity: 0;
    pointer-events: none;
  }
  body.ejected .flash { animation: flash 700ms ease-out; }
  body.ejected .stage { animation: shake 500ms cubic-bezier(.36,.07,.19,.97); }
  @keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); }
    20%, 80% { transform: translate(4px, -2px); }
    30%, 50%, 70% { transform: translate(-8px, 3px); }
    40%, 60% { transform: translate(8px, -3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    body.ejected .stage { animation: none; }
    body.ejected .flash { animation-duration: 1ms; }
    #eject, .bezel { transition: none; }
    .headline, #reset, .notice { animation: none; }
  }
</style>

<canvas id="scene" aria-hidden="true"></canvas>
<main class="stage">
  <div class="label" id="label">Press to eject</div>
  <div class="bezel">
    <div class="well">
      <button id="eject" type="button" aria-describedby="status">EJECT</button>
    </div>
  </div>
  <div class="status" id="status" role="status">ARMED &middot; SEAT 1</div>
</main>
<div class="overlay">
  <h1 class="headline" id="headline" hidden>veo accepted</h1>
  <div class="controls">
    <button id="reset" type="button" hidden>Rescind</button>
    <div class="notice" id="notice" hidden>manager notified</div>
  </div>
</div>
<div class="modal-back" id="modal" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
    <div class="modal-body">
      <h2 id="modal-title">Rescind your VEO?</h2>
      <p id="modal-desc">Your manager has already been notified. Rescinding cannot be undone, and there may be consequences.</p>
    </div>
    <div class="modal-actions">
      <button id="cancel-rescind" type="button">Keep my VEO</button>
      <button id="confirm-rescind" type="button">Rescind</button>
    </div>
  </div>
</div>
<div class="flash" aria-hidden="true"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const btn = $('eject'), reset = $('reset'), status = $('status');
  const headline = $('headline'), notice = $('notice');
  const canvas = $('scene'), g = canvas.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let state = 'off';          // off | pasture | fire
  let fireStart = 0, raf = 0;
  let W = 0, H = 0, blades = [], flowers = [], clouds = [], particles = [];
  let meteors = [], cracks = [], shake = 0, lastThud = 0;
  let jail = null, birdTimer = 0, crackleTimer = 0;
  let happy = null, pastureStart = 0, breezeNode = null, baaTimer = 0;

  // ---------- audio ----------
  let ctx;
  function audio() { try { return ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  function noise(seconds) {
    const len = ctx.sampleRate * seconds, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf; return src;
  }
  function boom() {
    if (!audio()) return;
    const t = ctx.currentTime, osc = ctx.createOscillator(), gn = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(35, t + 0.5);
    gn.gain.setValueAtTime(0.9, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    osc.connect(gn).connect(ctx.destination); osc.start(t); osc.stop(t + 0.6);
    const src = noise(1.2), f = ctx.createBiquadFilter(), ng = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 900; ng.gain.value = 0.5;
    src.connect(f).connect(ng).connect(ctx.destination); src.start(t + 0.05);
  }
  function whoosh() {
    if (!audio()) return;
    const t = ctx.currentTime, src = noise(2.8), f = ctx.createBiquadFilter(), ng = ctx.createGain();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(300, t);
    f.frequency.exponentialRampToValueAtTime(2400, t + 1.2);
    ng.gain.setValueAtTime(0.001, t);
    ng.gain.exponentialRampToValueAtTime(0.7, t + 0.6);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 2.8);
    src.connect(f).connect(ng).connect(ctx.destination); src.start(t);
    // low hellish rumble
    const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), rg = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(42, t); o.frequency.linearRampToValueAtTime(30, t + 5);
    lp.type = 'lowpass'; lp.frequency.value = 140;
    rg.gain.setValueAtTime(0.001, t);
    rg.gain.exponentialRampToValueAtTime(0.6, t + 0.8);
    rg.gain.setValueAtTime(0.6, t + 3.8);
    rg.gain.exponentialRampToValueAtTime(0.001, t + 5.2);
    o.connect(lp).connect(rg).connect(ctx.destination); o.start(t); o.stop(t + 5.3);
  }
  function tick(at, vol, freq) {
    const n = noise(0.025), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
    bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 4; ng.gain.value = vol;
    n.connect(bp).connect(ng).connect(ctx.destination); n.start(at);
  }
  function chirp() {
    if (!ctx) return;
    const t = ctx.currentTime, pips = 2 + (Math.random() * 3 | 0), base = 2600 + Math.random() * 1400;
    for (let i = 0; i < pips; i++) {
      const at = t + i * 0.11, o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(base, at); o.frequency.exponentialRampToValueAtTime(base * 1.5, at + 0.06);
      gn.gain.setValueAtTime(0.001, at); gn.gain.exponentialRampToValueAtTime(0.06, at + 0.015); gn.gain.exponentialRampToValueAtTime(0.001, at + 0.08);
      o.connect(gn).connect(ctx.destination); o.start(at); o.stop(at + 0.09);
    }
  }
  function chime() {
    if (!ctx || state !== 'pasture') return;
    const t = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      const at = t + i * 0.13, o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      gn.gain.setValueAtTime(0.001, at); gn.gain.exponentialRampToValueAtTime(0.14, at + 0.02); gn.gain.exponentialRampToValueAtTime(0.001, at + 1.4);
      o.connect(gn).connect(ctx.destination); o.start(at); o.stop(at + 1.5);
    });
  }
  // ---------- acceptance SFX ----------
  const cue = (ms, fn) => setTimeout(() => { if (state === 'pasture' && ctx) fn(); }, ms);
  function rocket() {
    const t = ctx.currentTime, o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), gn = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.9);
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(400, t); lp.frequency.exponentialRampToValueAtTime(3000, t + 0.9);
    gn.gain.setValueAtTime(0.001, t); gn.gain.exponentialRampToValueAtTime(0.25, t + 0.1); gn.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    o.connect(lp).connect(gn).connect(ctx.destination); o.start(t); o.stop(t + 1.2);
  }
  function chute() {
    const t = ctx.currentTime, n = noise(0.18), lp = ctx.createBiquadFilter(), gn = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 1400; gn.gain.value = 1.1;
    n.connect(lp).connect(gn).connect(ctx.destination); n.start(t);
    const f = noise(0.8), bp = ctx.createBiquadFilter(), fg = ctx.createGain(), lfo = ctx.createOscillator(), depth = ctx.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.8;
    lfo.type = 'square'; lfo.frequency.value = 17; depth.gain.value = 0.25; fg.gain.value = 0.25;
    lfo.connect(depth).connect(fg.gain);
    f.connect(bp).connect(fg).connect(ctx.destination); f.start(t + 0.12); lfo.start(t + 0.12); lfo.stop(t + 0.95);
  }
  function brass(f, at, dur, vol) {
    const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), gn = ctx.createGain(), vib = ctx.createOscillator(), vd = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = f;
    vib.frequency.value = 5.5; vd.gain.value = f * 0.006; vib.connect(vd).connect(o.frequency);
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, at); lp.frequency.linearRampToValueAtTime(2600, at + 0.08);
    gn.gain.setValueAtTime(0.001, at); gn.gain.exponentialRampToValueAtTime(vol, at + 0.03);
    gn.gain.setValueAtTime(vol, at + dur - 0.08); gn.gain.exponentialRampToValueAtTime(0.001, at + dur);
    o.connect(lp).connect(gn).connect(ctx.destination);
    o.start(at); vib.start(at); o.stop(at + dur + 0.02); vib.stop(at + dur + 0.02);
  }
  function fanfare() {
    const t = ctx.currentTime;
    [[392, 0], [523.25, 0.13], [659.25, 0.26], [783.99, 0.39]].forEach(([f, d]) => brass(f, t + d, 0.12, 0.12));
    [523.25, 659.25, 783.99, 1046.5].forEach((f) => brass(f, t + 0.55, 1.1, 0.07));
  }
  function applause() {
    const t = ctx.currentTime;
    const bed = noise(2.6), bp = ctx.createBiquadFilter(), bg = ctx.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 1000; bp.Q.value = 0.6;
    bg.gain.setValueAtTime(0.001, t); bg.gain.exponentialRampToValueAtTime(0.18, t + 0.3); bg.gain.exponentialRampToValueAtTime(0.001, t + 2.6);
    bed.connect(bp).connect(bg).connect(ctx.destination); bed.start(t);
    for (let i = 0; i < 140; i++) {
      const at = t + Math.pow(Math.random(), 1.6) * 2.4;
      tick(at, 0.06 + Math.random() * 0.18, 900 + Math.random() * 1800);
    }
  }
  function kaching() {
    const t = ctx.currentTime;
    tick(t, 0.9, 320); tick(t + 0.05, 0.6, 500);
    [0.12, 0.26].forEach((d) => [2093, 2637, 3136, 4186].forEach((f, i) => {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.frequency.value = f;
      gn.gain.setValueAtTime(0.09 / (i + 1), t + d); gn.gain.exponentialRampToValueAtTime(0.001, t + d + 1.2);
      o.connect(gn).connect(ctx.destination); o.start(t + d); o.stop(t + d + 1.25);
    }));
  }
  function baa() {
    const t = ctx.currentTime, base = 210 + Math.random() * 60, o = ctx.createOscillator(), lfo = ctx.createOscillator(), ld = ctx.createGain(), gn = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(base, t); o.frequency.linearRampToValueAtTime(base * 0.9, t + 0.6);
    lfo.frequency.value = 7; ld.gain.value = base * 0.06; lfo.connect(ld).connect(o.frequency);
    gn.gain.setValueAtTime(0.001, t); gn.gain.exponentialRampToValueAtTime(1.6, t + 0.06);
    gn.gain.setValueAtTime(1.6, t + 0.4); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
    for (const [fq, q] of [[850, 6], [1400, 7]]) {
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fq; bp.Q.value = q;
      o.connect(bp).connect(gn);
    }
    gn.connect(ctx.destination); o.start(t); lfo.start(t); o.stop(t + 0.7); lfo.stop(t + 0.7);
  }
  function baas() { if (state !== 'pasture') return; baa(); baaTimer = setTimeout(baas, 3500 + Math.random() * 4500); }
  function boing() {
    const t = ctx.currentTime, o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(520, t + 0.12);
    gn.gain.setValueAtTime(0.001, t); gn.gain.exponentialRampToValueAtTime(0.16, t + 0.02); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(gn).connect(ctx.destination); o.start(t); o.stop(t + 0.25);
  }
  function breeze() {
    const src = ctx.createBufferSource(), len = ctx.sampleRate * 3, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(), gn = ctx.createGain(), lfo = ctx.createOscillator(), ld = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 500;
    lfo.frequency.value = 0.15; ld.gain.value = 250; lfo.connect(ld).connect(lp.frequency);
    gn.gain.setValueAtTime(0.001, ctx.currentTime); gn.gain.exponentialRampToValueAtTime(0.09, ctx.currentTime + 2);
    src.connect(lp).connect(gn).connect(ctx.destination); src.start(); lfo.start();
    breezeNode = { src, lfo, gn };
  }
  function stopBreeze() {
    if (!breezeNode || !ctx) return;
    const { src, lfo, gn } = breezeNode, t = ctx.currentTime;
    gn.gain.cancelScheduledValues(t); gn.gain.setValueAtTime(gn.gain.value, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    src.stop(t + 0.55); lfo.stop(t + 0.55); breezeNode = null;
  }

  function birds() { if (state !== 'pasture') return; chirp(); birdTimer = setTimeout(birds, 500 + Math.random() * 1300); }
  function crackle() {
    if (state !== 'fire' || !ctx) return;
    const t = ctx.currentTime;

  // ---------- scene ----------
  const hills = [
    { base: 0.58, amp: 0.05, freq: 1.6, off: 0.3, green: [124, 178, 92], char: [70, 52, 40] },
    { base: 0.66, amp: 0.045, freq: 2.3, off: 2.1, green: [96, 160, 70], char: [52, 38, 30] },
    { base: 0.76, amp: 0.035, freq: 1.2, off: 4.0, green: [74, 140, 54], char: [36, 27, 22] },

  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * dpr; canvas.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const front = hills[2];
    blades = [];
    const n = Math.min(1600, Math.floor(W * 1.4));
    for (let i = 0; i < n; i++) {
      const x = Math.random() * W;
      const top = hillY(front, x);
      const y = top + Math.pow(Math.random(), 0.7) * (H - top + 10);
      const depth = (y - top) / (H - top + 1);
      blades.push({ x, y, h: 10 + depth * 34 + Math.random() * 10, phase: Math.random() * 6.28, shade: Math.random() });
    }
    blades.sort((a, b) => a.y - b.y);

      const x = Math.random() * W, top = hillY(front, x);
      return { x, y: top + Math.random() * (H - top), c: Math.random() < 0.5 ? '#fff7e0' : '#f6d64a' };
    });
    cracks = Array.from({ length: Math.max(6, Math.floor(W / 120)) }, () => {
      let x = Math.random() * W, y = hillY(front, x) + 20 + Math.random() * (H - hillY(front, x) - 20);
      const pts = [[x, y]];
      for (let s = 0; s < 8; s++) { x += (Math.random() - 0.3) * 40; y += (Math.random() - 0.5) * 18; pts.push([x, y]); }
      return pts;
    });

  }
  function buildHappy() {

      v: 50 + Math.random() * 50, s: 8 + Math.random() * 8, ph: Math.random() * 6, at: 1400 + i * 350 }));
    const flies = Array.from({ length: Math.max(6, W / 140 | 0) }, (_, i) => {
      const x = Math.random() * W, top = hillY(front, x);

        c: ['#ffb3d9', '#ffe066', '#9ad7ff', '#ffffff', '#c9a3ff'][i % 5], at: 1800 + Math.random() * 1500 };

  function draw(now) {
    const t = now / 1000;

    g.beginPath(); g.ellipse(17, -25 + graze, 4, 2, -0.5, 0, 6.28); g.fill();

  function drawBunny(x, y, dir, sc, a, fur) {

    g.fillStyle = fur;
    g.beginPath(); g.ellipse(0, -10, 12, 8, 0, 0, 6.28); g.fill();

    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(-12, -11, 4, 0, 6.28); g.fill();
    g.fillStyle = '#ffb3c6'; g.beginPath(); g.arc(15.5, -16, 1.4, 0, 6.28); g.fill();
    g.fillStyle = '#1d1a18'; g.beginPath(); g.arc(12, -18.5, 1.3, 0, 6.28); g.fill();
    g.restore();
  }

  // ---------- the jailer ----------
  const easeOutBack = (s) => 1 + 2.70158 * Math.pow(s - 1, 3) + 1.70158 * Math.pow(s - 1, 2);
  function easeOutBounce(x) {
    const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x;
    if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375;
    return n * (x -= 2.625 / d) * x + 0.984375;
  }
  function drawChain(x1, y1, x2, y2, L, th) {
    const dx = x2 - x1, dy = y2 - y1, a = Math.atan2(dy, dx), n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (L * 0.8)));
    for (let i = 0; i <= n; i++) {
      g.save();
      g.translate(x1 + dx * i / n, y1 + dy * i / n); g.rotate(a);
      const ry = i % 2 ? th * 0.45 : L * 0.3;
      for (const [w, c, oy] of [[th * 1.7, '#141516', 0], [th, '#878e94', 0], [th * 0.3, '#dfe4e7', -th * 0.25]]) {
        g.lineWidth = w; g.strokeStyle = c;
        g.beginPath(); g.ellipse(0, oy, L * 0.55, ry, 0, 0, 6.28); g.stroke();
      }
      g.restore();
    }
  }
  function drawJailer(now, t) {
    if (!jail || now < jail.riseAt) return;
    const r = clamp01((now - jail.riseAt) / 1300), e = 1 - Math.pow(1 - r, 3);
    const S = Math.min(H * 0.62, W * 0.85);
    const bob = r >= 1 && !reduced ? Math.sin(t * 2.2) * S * 0.008 : 0;
    const baseY = H + 6 + (1 - e) * S * 1.05 + bob;
    const rim = `rgba(255,120,30,${0.7 + Math.random() * 0.3})`, dark = '#0c0707';
    g.save();
    g.translate(W / 2, baseY); g.scale(S, S);
    g.lineCap = 'round'; g.lineJoin = 'round';
    // arms reaching out
    for (const sgn of [-1, 1]) {
      for (const [w, c] of [[0.075 + 6 / S, rim], [0.075, dark]]) {
        g.lineWidth = w; g.strokeStyle = c;
        g.beginPath(); g.moveTo(sgn * 0.17, -0.57); g.quadraticCurveTo(sgn * 0.34, -0.55, sgn * 0.37, -0.4); g.stroke();
      }
      g.fillStyle = dark; g.beginPath(); g.arc(sgn * 0.37, -0.4, 0.04, 0, 6.28); g.fill();
    }
    // robe
    g.fillStyle = dark; g.strokeStyle = rim; g.lineWidth = 3 / S;
    g.beginPath();
    g.moveTo(-0.3, 0.02); g.lineTo(-0.2, -0.6); g.quadraticCurveTo(0, -0.66, 0.2, -0.6); g.lineTo(0.3, 0.02); g.closePath();
    g.fill(); g.stroke();
    // belt and key ring
    g.beginPath(); g.moveTo(-0.24, -0.3); g.lineTo(0.24, -0.3); g.stroke();
    g.lineWidth = 4 / S; g.beginPath(); g.arc(0.12, -0.25, 0.035, 0, 6.28); g.stroke();
    // hood
    g.lineWidth = 3 / S;
    g.beginPath();
    g.moveTo(-0.16, -0.58);
    g.quadraticCurveTo(-0.15, -0.82, 0, -0.93);
    g.quadraticCurveTo(0.15, -0.82, 0.16, -0.58);
    g.quadraticCurveTo(0, -0.62, -0.16, -0.58);
    g.fill(); g.stroke();
    g.fillStyle = '#000'; g.beginPath(); g.ellipse(0, -0.72, 0.075, 0.085, 0, 0, 6.28); g.fill();
    // burning eyes
    g.shadowColor = '#ff2a10'; g.shadowBlur = 18; g.fillStyle = '#ff3a18';
    for (const sgn of [-1, 1]) { g.beginPath(); g.ellipse(sgn * 0.032, -0.735, 0.019, 0.008, sgn * 0.25, 0, 6.28); g.fill(); }
    g.restore();
    // chains dangling from his fists until he throws them
    if (now < jail.chains[0]) {
      const sw = reduced ? 0 : Math.sin(t * 2.4) * S * 0.05;
      for (const sgn of [-1, 1]) {
        const hx = W / 2 + sgn * 0.37 * S, hy = baseY - 0.4 * S;
        drawChain(hx, hy, hx + sw * sgn, hy + 0.34 * S, S * 0.04, S * 0.012);
      }
    }
  }
  function drawScreenChains(now) {
    if (!jail) return;
    const L = Math.min(W, H) * 0.075, th = L * 0.22, M = Math.max(W, H);
    const lines = [[-0.1 * W, -0.1 * H, 1.1 * W, 1.1 * H], [1.1 * W, -0.1 * H, -0.1 * W, 1.1 * H], [-0.1 * W, 0.5 * H, 1.1 * W, 0.5 * H]];
    jail.chains.forEach((st, i) => {
      if (now < st) return;
      const e = easeOutBack(clamp01((now - st) / 220));
      const [x1, y1, x2, y2] = lines[i], a = Math.atan2(y2 - y1, x2 - x1);
      const off = (1 - e) * M * 0.9 * (i % 2 ? 1 : -1), nx = -Math.sin(a) * off, ny = Math.cos(a) * off;
      drawChain(x1 + nx, y1 + ny, x2 + nx, y2 + ny, L, th);
    });
    if (now < jail.lockAt) return;
    const P = Math.min(W, H) * 0.12, cx = W / 2;
    const y = -P * 2 + (H / 2 + P * 0.2 + P * 2) * easeOutBounce(clamp01((now - jail.lockAt) / 450));
    g.lineCap = 'butt';
    for (const [w, c] of [[P * 0.26, '#141516'], [P * 0.18, '#7c8389']]) {
      g.lineWidth = w; g.strokeStyle = c;
      g.beginPath(); g.arc(cx, y - P * 0.5, P * 0.5, Math.PI, 0); g.lineTo(cx + P * 0.5, y - P * 0.3); g.moveTo(cx - P * 0.5, y - P * 0.5); g.lineTo(cx - P * 0.5, y - P * 0.3); g.stroke();
    }
    const body = g.createLinearGradient(0, y - P * 0.45, 0, y + P * 0.85);
    body.addColorStop(0, '#5a5f64'); body.addColorStop(1, '#202326');
    g.fillStyle = body; g.strokeStyle = '#0d0e0f'; g.lineWidth = P * 0.06;
    g.beginPath();
    if (g.roundRect) g.roundRect(cx - P * 0.8, y - P * 0.45, P * 1.6, P * 1.3, P * 0.18); else g.rect(cx - P * 0.8, y - P * 0.45, P * 1.6, P * 1.3);
    g.fill(); g.stroke();
    g.fillStyle = '#050505';
    g.beginPath(); g.arc(cx, y + P * 0.1, P * 0.13, 0, 6.28); g.fill();
    g.beginPath(); g.moveTo(cx - P * 0.07, y + P * 0.12); g.lineTo(cx + P * 0.07, y + P * 0.12); g.lineTo(cx + P * 0.1, y + P * 0.5); g.lineTo(cx - P * 0.1, y + P * 0.5); g.closePath(); g.fill();
  }
  function ember(x, y) {
    if (particles.length > 1700) return;
    particles.push({ x, y, vx: (Math.random() - 0.5) * 2.5, vy: -2 - Math.random() * 3, r: 1 + Math.random() * 1.6,
      life: 0, max: 1.5 + Math.random() * 1.5, seed: Math.random() * 6, grav: -0.02, ember: true });
  }
  function spawn(x, y, scale) {
    particles.push({ x: x + (Math.random() - 0.5) * 8, y, vx: (Math.random() - 0.5) * 0.6, vy: -1 - Math.random() * 2 * scale,
      r: 2 + Math.random() * 5 * scale, life: 0, max: 0.6 + Math.random() * 1.0, seed: Math.random() * 6, grav: -0.03 });
  }

  function startScene() { pastureStart = performance.now(); build(); cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); canvas.classList.add('on'); }
  function stopScene() { cancelAnimationFrame(raf); raf = 0; particles = []; meteors = []; shake = 0; jail = null; clearTimeout(birdTimer); clearTimeout(crackleTimer); g.clearRect(0, 0, W, H); }
  window.addEventListener('resize', () => { if (state !== 'off') build(); });

  // ---------- flow ----------
  btn.addEventListener('click', () => {
    if (state !== 'off') return;
    state = 'pasture';
    btn.classList.add('pressed');
    btn.disabled = true;
    document.body.classList.add('ejected');
    status.textContent = 'Ejected';
    boom();
    if (navigator.vibrate) { try { navigator.vibrate([80, 40, 200]); } catch (e) {} }
    setTimeout(startScene, 250);
    cue(60, rocket);
    cue(700, fanfare);
    cue(850, chute);
    cue(950, applause);
    cue(1100, breeze);
    birdTimer = setTimeout(birds, 1500);
    cue(2200, kaching);
    setTimeout(chime, 2900);
    cue(2550, baa);
    baaTimer = setTimeout(baas, 3400 + Math.random() * 1500);
    [2900, 3800].forEach((st) => [0, 630, 1260, 1890].forEach((d) => cue(st + d, boing)));
    setTimeout(() => { headline.hidden = false; }, 700);
    setTimeout(() => { reset.hidden = false; notice.hidden = false; reset.focus(); }, 1500);
  });

  const modal = $('modal'), cancelBtn = $('cancel-rescind'), confirmBtn = $('confirm-rescind');
  function openModal() {
    if (state !== 'pasture') return;
    modal.hidden = false;
    cancelBtn.focus();
  }
  function closeModal() { modal.hidden = true; if (state === 'pasture') reset.focus(); }
  reset.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  confirmBtn.addEventListener('click', () => { modal.hidden = true; doRescind(); });
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  modal.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      (document.activeElement === cancelBtn ? confirmBtn : cancelBtn).focus();
    }
  });

  function doRescind() {
    if (state !== 'pasture') return;
    state = 'fire';
    fireStart = performance.now();
    reset.hidden = true;
    notice.hidden = true;
    headline.hidden = true;
    stopBreeze();
    clearTimeout(baaTimer);
    whoosh();
    crackle();
    jail = { riseAt: fireStart + 3000, chains: [fireStart + 5000, fireStart + 5450, fireStart + 5900], lockAt: fireStart + 6500 };
    setTimeout(grind, 3000);
    setTimeout(laugh, 4300);
    jail.chains.forEach((c, i) => setTimeout(() => { clank(i === 2); shake = Math.min(34, shake + 26); }, c - fireStart + 140));
    setTimeout(() => { lockClick(); shake = Math.min(34, shake + 14); }, 6500 + 170);
    setTimeout(() => {
      canvas.classList.remove('on');
      document.body.classList.remove('ejected');
      btn.classList.remove('pressed');
      btn.disabled = false;
      status.textContent = 'ARMED · SEAT 1';
      btn.focus();
      setTimeout(() => { stopScene(); state = 'off'; }, 1250);
    }, 7900);
  }
</script>
