<title>Eject Button</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: one centered cockpit panel; hazard-striped bezel around a single red mushroom button. Single dark look by choice. */
  :root {
    --panel: #1c1f22;
    --panel-edge: #2b2f33;
    --ink: #d9dcd6;
    --dim: #7d847c;
    --hazard: #f2c230;
    --red: #d7261e;
    --red-deep: #8e1410;
    --flash: #ff5a3c;
    --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 40%, #24282c 0%, var(--panel) 60%);
    background-color: var(--panel);
    color: var(--ink);
    font-family: var(--display);
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    box-sizing: border-box;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    display: grid;
    justify-items: center;
    gap: clamp(20px, 4vh, 36px);
    width: 100%;
  }
  .label {
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: clamp(14px, 2.4vw, 18px);
    color: var(--hazard);
    padding-left: 0.35em;
  }
  .bezel {
    --size: min(72vw, 58vh, 420px);
    width: var(--size);
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 50%;
    padding: calc(var(--size) * 0.07);
    box-sizing: border-box;
    background: repeating-linear-gradient(45deg, var(--hazard) 0 22px, #111 22px 44px);
    box-shadow: 0 0 0 6px var(--panel-edge), 0 24px 60px rgba(0,0,0,0.6);
    display: grid;
  }
  .well {
    border-radius: 50%;
    background: #0d0f10;
    box-shadow: inset 0 10px 30px rgba(0,0,0,0.9);
    display: grid;
    padding: 6%;
  }
  #eject {
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 38% 30%, #ff6a5c 0%, var(--red) 38%, var(--red-deep) 100%);
    box-shadow: 0 14px 0 #5c0b08, 0 18px 30px rgba(0,0,0,0.7), inset 0 -8px 20px rgba(0,0,0,0.35);
    color: #fff;
    font-family: var(--display);
    font-weight: 700;
    font-size: calc(var(--size) * 0.12);
    letter-spacing: 0.12em;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    transform: translateY(-10px);
    transition: transform 90ms ease, box-shadow 90ms ease, filter 200ms;
  }
  #eject:hover { filter: brightness(1.08); }
  #eject:active, #eject.pressed {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #5c0b08, 0 4px 10px rgba(0,0,0,0.7), inset 0 -4px 14px rgba(0,0,0,0.4);
  }
  #eject:focus-visible { outline: 4px solid var(--hazard); outline-offset: 8px; }
  #eject:disabled { cursor: default; }

  .status {
    font-family: var(--mono);
    font-size: clamp(12px, 2vw, 14px);
    color: var(--dim);
    letter-spacing: 0.08em;
    min-height: 1.4em;
    text-align: center;
  }
  .status b { color: var(--flash); font-weight: 500; }
  #reset {
    font: 500 13px var(--mono);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--dim);
    border-radius: 4px;
    padding: 10px 18px;
    cursor: pointer;
  }
  #reset:hover { border-color: var(--hazard); color: var(--hazard); }
  #reset:focus-visible { outline: 2px solid var(--hazard); outline-offset: 3px; }

  .flash {
    position: fixed;
    inset: 0;
    background: var(--flash);
    opacity: 0;
    pointer-events: none;
  }
  body.ejected .flash { animation: flash 700ms ease-out; }
  body.ejected .stage { animation: shake 500ms cubic-bezier(.36,.07,.19,.97); }
  body.ejected .label { color: var(--flash); }
  @keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); }
    20%, 80% { transform: translate(4px, -2px); }
    30%, 50%, 70% { transform: translate(-8px, 3px); }
    40%, 60% { transform: translate(8px, -3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    body.ejected .stage { animation: none; }
    body.ejected .flash { animation-duration: 1ms; }
    #eject { transition: none; }
  }
</style>

<div class="flash" aria-hidden="true"></div>
<main class="stage">
  <div class="label" id="label">Pull to eject</div>
  <div class="bezel">
    <div class="well">
      <button id="eject" type="button" aria-describedby="status">EJECT</button>
    </div>
  </div>
  <div class="status" id="status" role="status">ARMED &middot; SEAT 1</div>
  <button id="reset" type="button" hidden>Re-arm</button>
</main>

<script>
  const btn = document.getElementById('eject');
  const reset = document.getElementById('reset');
  const status = document.getElementById('status');
  const label = document.getElementById('label');
  let ctx;

  function boom() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const t = ctx.currentTime;
      // low thump
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(35, t + 0.5);
      g.gain.setValueAtTime(0.9, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      osc.connect(g).connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.6);
      // rocket hiss
      const len = ctx.sampleRate * 1.2;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      const f = ctx.createBiquadFilter();
      const ng = ctx.createGain();
      src.buffer = buf;
      f.type = 'bandpass'; f.frequency.value = 900;
      ng.gain.value = 0.5;
      src.connect(f).connect(ng).connect(ctx.destination);
      src.start(t + 0.05);
    } catch (e) { /* no audio, no problem */ }
  }

  btn.addEventListener('click', () => {
    if (document.body.classList.contains('ejected')) return;
    btn.classList.add('pressed');
    btn.disabled = true;
    document.body.classList.add('ejected');
    label.textContent = 'Ejected';
    status.innerHTML = '<b>CANOPY JETTISON &middot; SEAT CLEAR</b>';
    boom();
    if (navigator.vibrate) { try { navigator.vibrate([80, 40, 200]); } catch (e) {} }
    setTimeout(() => { reset.hidden = false; reset.focus(); }, 900);
  });

  reset.addEventListener('click', () => {
    document.body.classList.remove('ejected');
    btn.classList.remove('pressed');
    btn.disabled = false;
    reset.hidden = true;
    label.textContent = 'Pull to eject';
    status.textContent = 'ARMED · SEAT 1';
    btn.focus();
  });
</script>
